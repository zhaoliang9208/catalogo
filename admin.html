<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - CubaVolt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap");
      body { font-family: "Inter", sans-serif; }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900 min-h-screen">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 z-[100] bg-gray-900 bg-opacity-90 flex items-center justify-center p-4">
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
          <h2 class="text-3xl font-bold text-gray-800">Acceso Admin</h2>
          <p class="text-gray-500 mt-2">Por favor, ingresa tus credenciales</p>
        </div>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
            <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">
            Entrar
          </button>
        </form>
        <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden">Usuario o contraseña incorrectos</p>
      </div>
    </div>

    <!-- Main Admin Panel -->
    <div id="admin-panel" class="hidden">
      <nav class="bg-white shadow-sm border-b border-gray-200 px-4 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
          <h1 class="text-xl font-bold text-indigo-600">Panel de Control CubaVolt</h1>
          <button id="logout-btn" class="text-sm text-gray-500 hover:text-red-500 transition-colors">Cerrar Sesión</button>
        </div>
      </nav>

      <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

          <!-- Form for New Product -->
          <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 sticky top-24">
              <h2 class="text-xl font-bold mb-6 text-gray-800">Añadir Nuevo Producto</h2>
              <form id="product-form" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
                  <input type="text" id="p-title" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej: Licras Deportivas" required>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                  <textarea id="p-desc" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Detalles del producto..." required></textarea>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
                  <input type="number" step="0.01" id="p-price" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0.00" required>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Ruta de Imagen Principal</label>
                  <input type="text" id="p-img" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="productos/imagen.jpg" required>
                  <p class="text-xs text-gray-400 mt-1">Usa rutas relativas como 'productos/licras.jpg'</p>
                </div>
                <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">
                  Guardar Producto
                </button>
              </form>
            </div>
          </div>

          <!-- Product List Manager -->
          <div class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-6 text-gray-800">Gestión de Productos</h2>
            <div id="admin-product-list" class="space-y-4">
              <!-- Products will be rendered here -->
            </div>
          </div>

        </div>
      </main>
    </div>

    <script>
      // --- Authentication ---
      const ADMIN_CREDENTIALS = { user: "admin", pass: "cuba123" }; // Cambia esto por seguridad

      const loginOverlay = document.getElementById("login-overlay");
      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");
      const adminPanel = document.getElementById("admin-panel");

      function checkAuth() {
        if (sessionStorage.getItem("cv_admin_auth") === "true") {
          loginOverlay.classList.add("hidden");
          adminPanel.classList.remove("hidden");
          renderAdminProducts();
        }
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        if (u === ADMIN_CREDENTIALS.user && p === ADMIN_CREDENTIALS.pass) {
          sessionStorage.setItem("cv_admin_auth", "true");
          loginOverlay.classList.add("hidden");
          adminPanel.classList.remove("hidden");
          renderAdminProducts();
        } else {
          loginError.classList.remove("hidden");
        }
      });

      document.getElementById("logout-btn").addEventListener("click", () => {
        sessionStorage.removeItem("cv_admin_auth");
        location.reload();
      });

      // --- Product Management ---

      // Default products to seed if localStorage is empty
      const DEFAULT_PRODUCTS = [
        {
          id: 1,
          title: "Licras Cortas Deportivas para Mujer",
          description: "Licras cortas deportivas en varios colores, todas con un diseño que realza los glúteos gracias a su efecto push-up. Son elásticas, cómodas y perfectas para entrenamientos de fitness, yoga o simplemente para uso diario. Su talle alto ofrece un buen soporte y su tela de mezcla de nylon y elastano asegura una gran flexibilidad y durabilidad.",
          price: 1.75,
          images: ["productos/licras.jpg"],
          hidden: false
        },
        {
          id: 2,
          title: "Carburador para plantas electricas",
          description: "Kit de conversión de carburador de doble combustible diseñado para generadores de 2-3KW, adecuado para motores GX160, GX200, 168F y 170F, que incluye un carburador de GLP y CNG con un interruptor manual.",
          price: 80.00,
          images: ["productos/carburador/1.avif", "productos/carburador/2.avif", "productos/carburador/3.avif", "productos/carburador/4.avif", "productos/carburador/5.avif"],
          hidden: false
        }
      ];

      function getProducts() {
        const stored = localStorage.getItem("cv_products");
        if (!stored) {
          localStorage.setItem("cv_products", JSON.stringify(DEFAULT_PRODUCTS));
          return DEFAULT_PRODUCTS;
        }
        return JSON.parse(stored);
      }

      function saveProducts(products) {
        localStorage.setItem("cv_products", JSON.stringify(products));
      }

      function renderAdminProducts() {
        const products = getProducts();
        const list = document.getElementById("admin-product-list");

        list.innerHTML = products.map(p => `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <img src="${p.images[0]}" class="w-12 h-12 rounded-lg object-cover border border-gray-200">
              <div>
                <p class="font-bold text-gray-800">${p.title}</p>
                <p class="text-xs text-gray-500">$${p.price.toFixed(2)}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="toggleVisibility(${p.id})" class="px-3 py-1 text-xs font-semibold rounded-lg transition-colors ${p.hidden ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-700'}">
                ${p.hidden ? 'Mostrar' : 'Ocultar'}
              </button>
              <button onclick="deleteProduct(${p.id})" class="px-3 py-1 text-xs font-semibold bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition-colors">
                Eliminar
              </button>
            </div>
          </div>
        `).join("");
      }

      window.toggleVisibility = (id) => {
        const products = getProducts();
        const p = products.find(item => item.id === id);
        if (p) p.hidden = !p.hidden;
        saveProducts(products);
        renderAdminProducts();
      };

      window.deleteProduct = (id) => {
        if (!confirm("¿Estás seguro de eliminar este producto?")) return;
        const products = getProducts().filter(item => item.id !== id);
        saveProducts(products);
        renderAdminProducts();
      };

      document.getElementById("product-form").addEventListener("submit", (e) => {
        e.preventDefault();
        const title = document.getElementById("p-title").value;
        const desc = document.getElementById("p-desc").value;
        const price = parseFloat(document.getElementById("p-price").value);
        const img = document.getElementById("p-img").value;

        const products = getProducts();
        products.push({
          id: Date.now(),
          title,
          description: desc,
          price,
          images: [img],
          hidden: false
        });

        saveProducts(products);
        renderAdminProducts();
        e.target.reset();
      });

      checkAuth();
    </script>
  </body>
</html>
