<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin - CubaVolt</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap");
      body { font-family: "Inter", sans-serif; }
    </style>
  </head>
  <body class="bg-gray-100 text-gray-900 min-h-screen">

    <!-- Login Overlay -->
    <div id="login-overlay" class="fixed inset-0 z-[100] bg-gray-900 bg-opacity-90 flex items-center justify-center p-4">
      <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-8">
          <h2 class="text-3xl font-bold text-gray-800">Acceso Admin</h2>
          <p class="text-gray-500 mt-2">Por favor, ingresa tus credenciales</p>
        </div>
        <form id="login-form" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Usuario</label>
            <input type="text" id="username" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
          </div>
          <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
            <input type="password" id="password" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" required>
          </div>
          <button type="submit" class="w-full bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">
            Entrar
          </button>
        </form>
        <p id="login-error" class="text-red-500 text-sm text-center mt-4 hidden">Usuario o contraseña incorrectos</p>
      </div>
    </div>

    <!-- Main Admin Panel -->
    <div id="admin-panel" class="hidden">
      <nav class="bg-white shadow-sm border-b border-gray-200 px-4 py-4">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
          <h1 class="text-xl font-bold text-indigo-600">Panel de Control CubaVolt</h1>
          <button id="logout-btn" class="text-sm text-gray-500 hover:text-red-500 transition-colors">Cerrar Sesión</button>
        </div>
      </nav>

      <main class="max-w-6xl mx-auto px-4 py-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-10">

          <!-- Form for Product -->
          <div class="lg:col-span-1">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-200 sticky top-24">
              <h2 id="form-title" class="text-xl font-bold mb-6 text-gray-800">Añadir Nuevo Producto</h2>
              <form id="product-form" class="space-y-4">
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Título</label>
                  <input type="text" id="p-title" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Ej: Licras Deportivas" required>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Descripción</label>
                  <textarea id="p-desc" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="Detalles del producto..." required></textarea>
                </div>
                <div>
                  <label class="block text-sm font-medium text-gray-700 mb-1">Precio ($)</label>
                  <input type="number" step="0.01" id="p-price" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none" placeholder="0.00" required>
                </div>
                <div class="space-y-2">
                  <label class="block text-sm font-medium text-gray-700 mb-1">Imágenes (Máx 5)</label>
                  <input type="file" id="p-imgs" multiple accept="image/*" class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                  <div id="img-preview" class="flex flex-wrap gap-2 mt-2"></div>
                  <p class="text-xs text-gray-400 mt-1">Sube hasta 5 imágenes. Se guardarán en la carpeta /productos.</p>
                </div>
                <div class="flex gap-2">
                  <button type="submit" id="submit-btn" class="flex-1 bg-indigo-600 text-white py-2 rounded-lg font-semibold hover:bg-indigo-700 transition-colors">
                    Guardar Producto
                  </button>
                  <button type="button" id="cancel-btn" class="hidden px-4 py-2 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition-colors">
                    Cancelar
                  </button>
                </div>
              </form>
            </div>
          </div>

          <!-- Product List Manager -->
          <div class="lg:col-span-2">
            <h2 class="text-xl font-bold mb-6 text-gray-800">Gestión de Productos</h2>
            <div id="admin-product-list" class="space-y-4">
              <!-- Products will be rendered here -->
            </div>
          </div>

        </div>
      </main>
    </div>

    <script>
      // --- Authentication ---
      const ADMIN_CREDENTIALS = { user: "admin", pass: "cuba123" };

      const loginOverlay = document.getElementById("login-overlay");
      const loginForm = document.getElementById("login-form");
      const loginError = document.getElementById("login-error");
      const adminPanel = document.getElementById("admin-panel");

      function checkAuth() {
        if (sessionStorage.getItem("cv_admin_auth") === "true") {
          loginOverlay.classList.add("hidden");
          adminPanel.classList.remove("hidden");
          renderAdminProducts();
        }
      }

      loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const u = document.getElementById("username").value;
        const p = document.getElementById("password").value;

        if (u === ADMIN_CREDENTIALS.user && p === ADMIN_CREDENTIALS.pass) {
          sessionStorage.setItem("cv_admin_auth", "true");
          loginOverlay.classList.add("hidden");
          adminPanel.classList.remove("hidden");
          renderAdminProducts();
        } else {
          loginError.classList.remove("hidden");
        }
      });

      document.getElementById("logout-btn").addEventListener("click", () => {
        sessionStorage.removeItem("cv_admin_auth");
        location.reload();
      });

      // --- Product Management ---
      let editingId = null;
      let directoryHandle = null;

      const DEFAULT_PRODUCTS = [
        {
          id: 1,
          title: "Licras Cortas Deportivas para Mujer",
          description: "Licras cortas deportivas en varios colores, todas con un diseño que realza los glúteos gracias a su efecto push-up. Son elásticas, cómodas y perfectas para entrenamientos de fitness, yoga o simplemente para uso diario. Su talle alto ofrece un buen soporte y su tela de mezcla de nylon y elastano asegura una gran flexibilidad y durabilidad.",
          price: 1.75,
          images: ["productos/licras.jpg"],
          hidden: false
        },
        {
          id: 2,
          title: "Carburador para plantas electricas",
          description: "Kit de conversión de carburador de doble combustible diseñado para generadores de 2-3KW, adecuado para motores GX160, GX200, 168F y 170F, que incluye un carburador de GLP y CNG con un interruptor manual.",
          price: 80.00,
          images: ["productos/carburador/1.avif", "productos/carburador/2.avif", "productos/carburador/3.avif", "productos/carburador/4.avif", "productos/carburador/5.avif"],
          hidden: false
        }
      ];

      function getProducts() {
        const stored = localStorage.getItem("cv_products");
        if (!stored) {
          localStorage.setItem("cv_products", JSON.stringify(DEFAULT_PRODUCTS));
          return DEFAULT_PRODUCTS;
        }
        return JSON.parse(stored);
      }

      function saveProducts(products) {
        localStorage.setItem("cv_products", JSON.stringify(products));
      }

      function renderAdminProducts() {
        const products = getProducts();
        const list = document.getElementById("admin-product-list");

        list.innerHTML = products.map(p => `
          <div class="bg-white p-4 rounded-xl shadow-sm border border-gray-200 flex items-center justify-between gap-4">
            <div class="flex items-center gap-4">
              <img src="${p.images[0]}" class="w-12 h-12 rounded-lg object-cover border border-gray-200">
              <div>
                <p class="font-bold text-gray-800">${p.title}</p>
                <p class="text-xs text-gray-500">$${p.price.toFixed(2)}</p>
              </div>
            </div>
            <div class="flex items-center gap-3">
              <button onclick="editProduct(${p.id})" class="px-3 py-1 text-xs font-semibold bg-indigo-100 text-indigo-600 rounded-lg hover:bg-indigo-200 transition-colors">
                Editar
              </button>
              <button onclick="toggleVisibility(${p.id})" class="px-3 py-1 text-xs font-semibold rounded-lg transition-colors ${p.hidden ? 'bg-gray-200 text-gray-600' : 'bg-green-100 text-green-700'}">
                ${p.hidden ? 'Mostrar' : 'Ocultar'}
              </button>
              <button onclick="deleteProduct(${p.id})" class="px-3 py-1 text-xs font-semibold bg-red-100 text-red-600 rounded-lg hover:bg-red-200 transition-colors">
                Eliminar
              </button>
            </div>
          </div>
        `).join("");
      }

      window.toggleVisibility = (id) => {
        const products = getProducts();
        const p = products.find(item => item.id === id);
        if (p) p.hidden = !p.hidden;
        saveProducts(products);
        renderAdminProducts();
      };

      window.deleteProduct = (id) => {
        if (!confirm("¿Estás seguro de eliminar este producto?")) return;
        const products = getProducts().filter(item => item.id !== id);
        saveProducts(products);
        renderAdminProducts();
      };

      window.editProduct = (id) => {
        const products = getProducts();
        const p = products.find(item => item.id === id);
        if (!p) return;

        editingId = id;
        document.getElementById("p-title").value = p.title;
        document.getElementById("p-desc").value = p.description;
        document.getElementById("p-price").value = p.price;

        document.getElementById("p-imgs").value = "";
        document.getElementById("form-title").innerText = "Editar Producto";
        document.getElementById("submit-btn").innerText = "Actualizar Producto";
        document.getElementById("cancel-btn").classList.remove("hidden");

        window.scrollTo({ top: 0, behavior: 'smooth' });
      };

      document.getElementById("cancel-btn").addEventListener("click", () => {
        editingId = null;
        document.getElementById("product-form").reset();
        document.getElementById("form-title").innerText = "Añadir Nuevo Producto";
        document.getElementById("submit-btn").innerText = "Guardar Producto";
        document.getElementById("cancel-btn").classList.add("hidden");
      });

      async function saveImagesToFolder(files) {
        if (!directoryHandle) {
          try {
            directoryHandle = await window.showDirectoryPicker({
              mode: 'readwrite'
            });
          } catch (e) {
            alert("Debes dar acceso a la carpeta de productos para subir imágenes.");
            throw e;
          }
        }

        const savedPaths = [];
        for (const file of files) {
          const fileHandle = await directoryHandle.getFileHandle(file.name, { create: true });
          const writable = await fileHandle.createWritable();
          await writable.write(file);
          await writable.close();
          savedPaths.push(`productos/${file.name}`);
        }
        return savedPaths;
      }

      document.getElementById("product-form").addEventListener("submit", async (e) => {
        e.preventDefault();

        const title = document.getElementById("p-title").value;
        const desc = document.getElementById("p-desc").value;
        const price = parseFloat(document.getElementById("p-price").value);
        const imgInput = document.getElementById("p-imgs");
        const files = Array.from(imgInput.files);

        if (files.length > 5) {
          alert("Solo puedes subir hasta 5 imágenes.");
          return;
        }

        let images = [];
        if (files.length > 0) {
          try {
            images = await saveImagesToFolder(files);
          } catch (err) {
            console.error(err);
            return;
          }
        } else if (editingId) {
          const products = getProducts();
          const p = products.find(item => item.id === editingId);
          images = p ? p.images : [];
        } else {
          alert("Por favor, sube al menos una imagen.");
          return;
        }

        const products = getProducts();
        if (editingId) {
          const p = products.find(item => item.id === editingId);
          if (p) {
            p.title = title;
            p.description = desc;
            p.price = price;
            p.images = images;
          }
        } else {
          products.push({
            id: Date.now(),
            title,
            description: desc,
            price,
            images,
            hidden: false
          });
        }

        saveProducts(products);
        renderAdminProducts();

        editingId = null;
        document.getElementById("product-form").reset();
        document.getElementById("form-title").innerText = "Añadir Nuevo Producto";
        document.getElementById("submit-btn").innerText = "Guardar Producto";
        document.getElementById("cancel-btn").classList.add("hidden");
        alert("Producto guardado exitosamente.");
      });

      checkAuth();
    </script>
  </body>
</html>
